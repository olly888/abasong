<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>认识 Abasong｜配送司机协作网络</title>
    <meta
      name="description"
      content="Abasong，让跑配送的同行互相帮一把。了解附近公寓查码、便捷共享与配送协作。"
    />
    <link rel="stylesheet" href="./invite.css" />
    <link rel="icon" href="./scene.svg" type="image/svg+xml" />
  </head>
  <body>
    <main>
      <header class="brand"><span aria-hidden="true">a</span> abasong</header>
      <h1>到了公寓进不去？<br />多一个<span>查码的办法。</span></h1>
      <p class="intro">Abasong，让跑配送的同行互相帮一把。</p>
      <img class="scene" src="./scene.svg" alt="" width="310" height="100" />
      <section aria-label="Abasong 能帮你做什么">
        <ul>
          <li>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" />
              <circle cx="12" cy="10" r="2.5" />
            </svg>
            <div>
              <h2>看附近公寓的共享门禁码</h2>
              <p>核对门牌地址，再查看同行共享的资料。</p>
            </div>
          </li>
          <li>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14" />
            </svg>
            <div>
              <h2>把知道的资料便捷共享</h2>
              <p>选截图或手动填写，核对后再共享。</p>
            </div>
          </li>
          <li>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="9" cy="7" r="3" />
              <path
                d="M3 19v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m3-6a4 4 0 0 1 3 4v2M16 4a3 3 0 0 1 0 6"
              />
            </svg>
            <div>
              <h2>有空找活，送不完找人</h2>
              <p>查看配送需求，和对方直接联系。</p>
            </div>
          </li>
        </ul>
      </section>
      <p class="source">门禁资料由同行共享，覆盖持续积累。</p>
      <section class="distribution" aria-label="获取 Abasong">
        <h2>内测准备中</h2>
        <p>获取入口尚未开放。你可以先了解 Abasong。</p>
      </section>
      <footer>
        <details>
          <summary>隐私与使用说明</summary>
          <p>
            邀请页不收集手机号、位置或门禁资料。实际查看和共享按账号资格与使用条件执行。
          </p>
        </details>
      </footer>
    </main>
  </body>
</html>

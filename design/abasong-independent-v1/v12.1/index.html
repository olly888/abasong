<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Abasong V12.1 · 交互原型</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="prototype.css"></head>
<body><div class="studio"><aside class="lab left"><div class="studio-brand"><span class="brand-symbol">a</span>abasong</div><p class="version">V12.1 · 交互原型</p><h1>关键时候，<br>找到帮助。</h1><div class="flow-links"><button data-lab="apartment">01 <span>公寓查询与贡献</span></button><button data-lab="support">02 <span>临时支援与报名</span></button><button data-lab="publish">03 <span>发布与管理需求</span></button><button data-lab="community">04 <span>司机圈与我的</span></button></div><div class="lab-control"><label for="scenario">公寓场景</label><select id="scenario"><option value="normal">已识别 · 有可用记录</option><option value="ambiguous">相邻公寓 · 多个候选</option><option value="empty">这栋公寓暂无密码</option><option value="no-fixed">没有固定密码</option><option value="denied">未开启定位</option><option value="stale">位置已过期</option><option value="offline">网络连接失败</option><option value="unqualified">没有资料查看资格</option><option value="guest">尚未登录</option><option value="feedback-fail">反馈提交失败</option></select></div><button class="reset" data-lab="reset">重置演示数据</button></aside><main class="device" id="device"><div class="statusbar"><b>9:41</b><div class="device-island"></div><span aria-hidden="true">▮▮▮ &nbsp; ▰</span></div><div id="app"></div><div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div></main><aside class="lab right"><div class="review-label">当前页面</div><h2 id="screen-title">首页 · 公寓</h2><p id="screen-id" class="version">H01</p><div class="review-rule"></div><h3>可体验的流程</h3><p>展开卡片，查看多条密码；反馈、添加、纠正公寓，并在返回后保留阅读位置。</p><p>切换找活或找人，完成报名、联系、发布、关闭和公开摘要预览。</p><div class="review-rule"></div><label class="lab-check"><input type="checkbox" id="send-fail">下一条消息发送失败</label><label class="lab-check"><input type="checkbox" id="change-price">报名提交前条件发生变化</label><button class="reset" data-lab="expire">将当前需求设为到期</button><br><button class="reset" data-lab="invalidate">将当前首条密码设为失效</button><div class="review-rule"></div><p class="prototype-note">仅使用合成数据与示意地图。定位、消息、发布及登录均为本地交互，不连接真实服务。业务数据在刷新后重置；公开摘要仅暂存于本浏览器，可通过重置清除。</p><p class="spec-link">页面规格：项目 docs/product</p><p class="prototype-note">演示登录验证码：123456。只校验输入格式，不发送短信。</p><label for="inspect-page" class="review-label">页面目录</label><select id="inspect-page" aria-label="页面目录"><option value="">选择页面检查</option></select></aside></div><script src="app.js"></script></body></html>

        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
      required:
      - job_id
      - status
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
      required:
      - status
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 60
          minLength: 1
        bio:
          type: string
          maxLength: 500
        vehicle_type:
          type: string
          maxLength: 60
        locale:
          type: string
          enum:
          - zh-CN
          - en-US
        timezone:
          type: string
          maxLength: 80
        experience:
          type: array
          items:
            $ref: '#/components/schemas/ExperienceInput'
    ExperienceInput:
      type: object
      additionalProperties: false
      properties:
        carrier:
          type: string
          maxLength: 80
        region_label:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 300
      required:
      - carrier
      - region_label
      - description
    Experience:
      type: object
      additionalProperties: false
      properties:
        carrier:
          type: string
          maxLength: 80
        region_label:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 300
        source:
          type: string
          enum:
          - self_reported
          - verified
      required:
      - carrier
      - region_label
      - description
      - source
    Profile:
      type: object
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 60
        bio:
          type: string
          maxLength: 500
          nullable: true
        vehicle_type:
          type: string
          maxLength: 60
          nullable: true
        experience:
          type: array
